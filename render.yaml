services:
  # ==============================================================
  # 🚀 STATIC SITE EN RENDER (Activo para ahorrar Bandwidth y evitar suspensión)
  # Publica la carpeta ./public con CDN gratuito de Render (100 GB/mes)
  # Mantiene los mismos enlaces (/coordinacion, /panol, /mobile, /login) mediante rewrites
  # ==============================================================
  - type: static
    name: panol-static-site
    region: oregon
    staticPublishPath: ./public
    routes:
      - type: rewrite
        source: /coordinacion
        destination: /coordinacion.html
      - type: rewrite
        source: /panol
        destination: /panol.html
      - type: rewrite
        source: /monitor
        destination: /panol.html
      - type: rewrite
        source: /mobile
        destination: /mobile.html
      - type: rewrite
        source: /m
        destination: /mobile.html
      - type: rewrite
        source: /app-mecanico
        destination: /mobile.html
      - type: rewrite
        source: /login
        destination: /login.html
      - type: rewrite
        source: /wireframe
        destination: /coordinacion.html

  # ==============================================================
  # 🔄 WEB SERVICE MONOLITO EN RENDER (Para Rollback)
  # Descomentar o mantener para volver a correr el backend directamente en Render
  # ==============================================================
  - type: web
    name: panol-monolith-service
    env: node
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: SPREADSHEET_ID
        value: 1aKptNgy8a9Ca3rDW-HSlWEiriMRJMOIJuFsdViwEGFc
      - key: SOURCE_SPREADSHEET_ID
        value: 1HKXGsRC149Kw4aBXQwGcPVpAvObvTUFis6YV6R5cTXk
      - key: MES_MOVIMIENTOS_ID
        value: 1Bwj8WCykMn_FbZhQ_FqnDH3K_WCod52YTSvsaxIDNS8
      - key: OT_SYNC_INTERVAL_MINUTES
        value: 2
      - key: NODE_ENV
        value: production

  # ==============================================================
  # ⚙️ EXTRACTOR SERVICE PYTHON
  # ==============================================================
  - type: web
    name: ot-extractor-service
    env: python
    region: oregon
    rootDir: extractor
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SPREADSHEET_ID
        value: 1aKptNgy8a9Ca3rDW-HSlWEiriMRJMOIJuFsdViwEGFc
      - key: GOOGLE_CREDENTIALS
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0
