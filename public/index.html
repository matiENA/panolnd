    // ===========================================
    // AUTOCOMPLETADO DE UNIDADES & OTs (WORKFLOW BIDIRECCIONAL)
    // ===========================================
    let fleetSearchCatalog = { pairs: [], tractors: [], semis: [], tractorOts: [], semiOts: [], allOts: [], unitList: [] };

    function fetchUnitCatalog() {
      google.script.run.withSuccessHandler(cat => {
        if (cat && cat.pairs) {
          fleetSearchCatalog = cat;
          dbUnitList = cat.unitList || [];
        } else if (Array.isArray(cat)) {
          dbUnitList = cat;
          fleetSearchCatalog.unitList = cat;
        }
      }).getFleetSearchCatalog();
    }

    function filterUnitAutocomplete(val, inputId, listId, type) {
      const list = document.getElementById(listId);
      if (!list) return;
      list.innerHTML = "";
      if (!val || val.trim().length < 2) { list.style.display = "none"; return; }

      const q = val.trim().toUpperCase();
      const qNorm = q.replace(/[\s\-_.]/g, '');
      const qOtNorm = qNorm.replace(/^0+/, '');
      let suggestions = [];

      const pairs = fleetSearchCatalog.pairs || [];

      if (type === 'TRACTOR') {
        const seen = new Set();
        pairs.forEach(p => {
          const t = (p.tractor || '').toUpperCase();
          const tNorm = t.replace(/[\s\-_.]/g, '');
          if (tNorm.includes(qNorm) || t.includes(q)) {
            if (!seen.has(t)) {
              seen.add(t);
              suggestions.push({
                val: t,
                primary: t,
                secondary: (p.tractorOt ? `OT: ${p.tractorOt}` : '') + (p.semi ? ` · Semi: ${p.semi}` : '')
              });
            }
          }
        });
        (fleetSearchCatalog.tractors || []).forEach(t => {
          const tUpper = String(t).toUpperCase();
          if (!seen.has(tUpper) && tUpper.replace(/[\s\-_.]/g, '').includes(qNorm)) {
            seen.add(tUpper);
            suggestions.push({ val: tUpper, primary: tUpper, secondary: 'Tractor' });
          }
        });
      }
      else if (type === 'OT' || type === 'OT_TRACTOR') {
        const seen = new Set();
        pairs.forEach(p => {
          const tot = String(p.tractorOt || '').trim();
          const totNorm = tot.replace(/^0+/, '');
          if (tot && (tot.includes(qNorm) || (qOtNorm && totNorm.includes(qOtNorm)))) {
            if (!seen.has(tot)) {
              seen.add(tot);
              suggestions.push({
                val: tot,
                primary: `OT ${tot}`,
                secondary: (p.tractor ? `Tractor: ${p.tractor}` : '') + (p.semi ? ` · Semi: ${p.semi}` : '')
              });
            }
          }
        });
        const combinedOts = [...(fleetSearchCatalog.tractorOts || []), ...(fleetSearchCatalog.allOts || [])];
        combinedOts.forEach(ot => {
          const sOt = String(ot).trim();
          const sOtNorm = sOt.replace(/^0+/, '');
          if (sOt && (sOt.includes(qNorm) || (qOtNorm && sOtNorm.includes(qOtNorm)))) {
            if (!seen.has(sOt)) {
              seen.add(sOt);
              suggestions.push({ val: sOt, primary: `OT ${sOt}`, secondary: 'Orden de Trabajo' });
            }
          }
        });
      }
      else if (type === 'SEMI') {
        const seen = new Set();
        pairs.forEach(p => {
          const s = (p.semi || '').toUpperCase();
          const sNorm = s.replace(/[\s\-_.]/g, '');
          if (sNorm && (sNorm.includes(qNorm) || s.includes(q))) {
            if (!seen.has(p.semi)) {
              seen.add(p.semi);
              suggestions.push({
                val: s,
                primary: s,
                secondary: (p.semiOt ? `OT: ${p.semiOt}` : '') + (p.tractor ? ` · Tractor: ${p.tractor}` : '')
              });
            }
          }
        });
        (fleetSearchCatalog.semis || []).forEach(s => {
          const sUpper = String(s).toUpperCase();
          if (!seen.has(sUpper) && sUpper.replace(/[\s\-_.]/g, '').includes(qNorm)) {
            seen.add(sUpper);
            suggestions.push({ val: sUpper, primary: sUpper, secondary: 'Semi' });
          }
        });
      }
      else if (type === 'SEMI_OT') {
        const seen = new Set();
        pairs.forEach(p => {
          const sot = String(p.semiOt || '').trim();
          const sotNorm = sot.replace(/^0+/, '');
          if (sot && (sot.includes(qNorm) || (qOtNorm && sotNorm.includes(qOtNorm)))) {
            if (!seen.has(sot)) {
              seen.add(sot);
              suggestions.push({
                val: sot,
                primary: `OT ${sot}`,
                secondary: (p.semi ? `Semi: ${p.semi}` : '') + (p.tractor ? ` · Tractor: ${p.tractor}` : '')
              });
            }
          }
        });
        const combinedSemiOts = [...(fleetSearchCatalog.semiOts || []), ...(fleetSearchCatalog.allOts || [])];
        combinedSemiOts.forEach(ot => {
          const sOt = String(ot).trim();
          const sOtNorm = sOt.replace(/^0+/, '');
          if (sOt && (sOt.includes(qNorm) || (qOtNorm && sOtNorm.includes(qOtNorm)))) {
            if (!seen.has(sOt)) {
              seen.add(sOt);
              suggestions.push({ val: sOt, primary: `OT ${sOt}`, secondary: 'OT Semi' });
            }
          }
        });
      }

      // Fallback si suggestions está vacío
      if (suggestions.length === 0 && dbUnitList.length > 0) {
        dbUnitList.filter(p => String(p).toUpperCase().includes(qNorm) || String(p).toUpperCase().includes(q)).slice(0, 8).forEach(item => {
          suggestions.push({ val: item, primary: item, secondary: '' });
        });
      }

      suggestions = suggestions.slice(0, 8);
      if (suggestions.length === 0) { list.style.display = "none"; return; }

      suggestions.forEach(item => {
        const div = document.createElement('div');
        div.className = 'popover-option';
        div.innerHTML = `
          <div style="font-weight:700; font-size:12px; color:#f0f6fc;">${item.primary}</div>
          ${item.secondary ? `<div style="font-size:10px; color:#8b949e; margin-top:2px;">${item.secondary}</div>` : ''}
        `;
        div.onmousedown = (e) => {
          e.preventDefault();
          document.getElementById(inputId).value = item.val;
          list.style.display = "none";
          searchAndAutofillPair(item.val, type);
        };
        list.appendChild(div);
      });
      list.style.display = "block";
    }

    function handleSearchKeydown(event, inputId, listId, type) {
      if (event.key === 'Enter') {
        event.preventDefault();
        const list = document.getElementById(listId);
        if (list) list.style.display = 'none';
        const val = document.getElementById(inputId).value.trim();
        if (val) {
          searchAndAutofillPair(val, type);
        }
      } else if (event.key === 'Escape') {
        const list = document.getElementById(listId);
        if (list) list.style.display = 'none';
      }
    }

    function handleSearchBlur(inputId, listId, type) {
      setTimeout(() => {
        const list = document.getElementById(listId);
        if (list) list.style.display = 'none';
        const val = document.getElementById(inputId).value.trim();
        if (val && val.length >= 2) {
          const tp = document.getElementById('holdTractorPlate').value.trim();
          const tot = document.getElementById('holdTractorOt').value.trim();
          const sp = document.getElementById('holdSemiPlate').value.trim();
          const sot = document.getElementById('holdSemiOt').value.trim();
          if (!tp || !tot || !sp || !sot) {
            searchAndAutofillPair(val, type);
          }
        }
      }, 200);
    }

    let isAutofilling = false;

    function searchAndAutofillPair(val, type) {
      if (!val || String(val).trim().length < 2 || isAutofilling) return;
      isAutofilling = true;

      google.script.run.withSuccessHandler(res => {
        isAutofilling = false;
        if (res && res.success) {
          const elTractorPlate = document.getElementById('holdTractorPlate');
          const elTractorOt = document.getElementById('holdTractorOt');
          const elSemiPlate = document.getElementById('holdSemiPlate');
          const elSemiOt = document.getElementById('holdSemiOt');

          if (res.unit && elTractorPlate) {
            elTractorPlate.value = res.unit;
            if (type !== 'TRACTOR') flashInputHighlight(elTractorPlate);
          }
          if (res.ot && elTractorOt) {
            elTractorOt.value = res.ot;
            if (type !== 'OT' && type !== 'OT_TRACTOR') flashInputHighlight(elTractorOt);
          }
          if (res.semi && elSemiPlate) {
            elSemiPlate.value = res.semi;
            if (type !== 'SEMI') flashInputHighlight(elSemiPlate);
          }
          if (res.semiOt && elSemiOt) {
            elSemiOt.value = res.semiOt;
            if (type !== 'SEMI_OT') flashInputHighlight(elSemiOt);
          }
        }
      }).withFailureHandler(err => {
        isAutofilling = false;
        console.warn('Error en búsqueda de unidad/OT:', err);
      }).findUnitOrOt(val, type);
    }

    function flashInputHighlight(el) {
      if (!el) return;
      const originalBorder = el.style.borderColor;
      const originalBg = el.style.backgroundColor;
      el.style.borderColor = '#238636';
      el.style.backgroundColor = 'rgba(35, 134, 54, 0.18)';
      setTimeout(() => {
        el.style.borderColor = originalBorder;
        el.style.backgroundColor = originalBg;
      }, 900);
    }

    document.addEventListener('click', e => {
      ['tractorPlatePop', 'tractorOtPop', 'semiPlatePop', 'semiOtPop'].forEach(id => {
        const el = document.getElementById(id);
        if (el && !el.parentElement.contains(e.target)) el.style.display = 'none';
      });
    });

    // ===========================================
    // MONITOR DE PEDIDOS (TAB 2)
    // ===========================================
    function toggleHistory(val) {
      showHistory = val;
      document.getElementById('btnFilterActivos').classList.toggle('active', !val);
      document.getElementById('btnFilterHistorial').classList.toggle('active', val);
      renderLiveOrders(allLoadedOrders);
    }

    function refreshOrders() {
      google.script.run.withSuccessHandler(orders => {
        allLoadedOrders = orders || [];
        updateActiveOrdersBadge(allLoadedOrders);
        renderLiveOrders(allLoadedOrders);
      }).getMechanicOrders(activeOpId);
    }

    function updateActiveOrdersBadge(orders) {
      const myOrders = (orders || []).filter(o => !activeOpId || String(o.opId || '').trim().toLowerCase() === String(activeOpId || '').trim().toLowerCase());
      const activeCount = myOrders.filter(o => o.status === 'PENDIENTE' || o.status === 'LISTO' || o.status === 'EN_PREPARACION' || o.status === 'DEVOLUCION PENDIENTE' || o.status === 'DEVOLUCION_PENDIENTE').length;
      const b = document.getElementById('activeOrdersBadge');
      if (b) {
        const displayCount = activeCount > 0 ? activeCount : 2;
        b.innerText = `${displayCount} activos`;
        b.classList.toggle('active-alert', activeCount > 0);
      }
    }

    function renderLiveOrders(orders) {
      const container = document.getElementById('orders-container');
      if (!container) return;
      container.innerHTML = "";

      // Solo renderizar los pertenecientes a la ID logueada (DB_TRANSACTIONS Col C)
      let filtered = (orders || []).filter(o => !activeOpId || String(o.opId || '').trim().toLowerCase() === String(activeOpId || '').trim().toLowerCase());

      if (!showHistory) {
        filtered = filtered.filter(o => o.status === 'PENDIENTE' || o.status === 'LISTO' || o.status === 'EN_PREPARACION' || o.status === 'DEVOLUCION PENDIENTE' || o.status === 'DEVOLUCION_PENDIENTE');
      }

      if (filtered.length === 0) {
        container.innerHTML = `<div style="text-align:center; padding:50px; color:var(--text-dim); font-size:0.85rem;">No hay pedidos registrados para esta terminal.</div>`;
        return;
      }

      filtered.forEach(o => {
        const div = document.createElement('div');
        const statusClass = (o.status || '').replace(/\s+/g, '_');
        div.className = `order-card-row status-${statusClass}`;

        const itemsText = (o.items || []).map(i => `${i.qty}x ${i.name}`).join(', ');
        const returnableItems = (o.items || []).filter(i => i.status === 'ENTREGADO');
        const canReturn = o.status === 'ENTREGADO' || returnableItems.length > 0;

        let statusLabel = o.status || 'PENDIENTE';
        if (o.status === 'DEVOLUCION PENDIENTE' || o.status === 'DEVOLUCION_PENDIENTE') {
          statusLabel = '↩️ DEVOLUCIÓN PENDIENTE';
        } else if (o.status === 'DEVOLUCION') {
          statusLabel = '📥 DEVOLUCIÓN ACEPTADA';
        }

        const returnBtnHtml = canReturn ? `
          <button class="btn-return-order" onclick="tryReturn('${o.reqId}')" title="Solicitar devolución de repuesto al Pañol">
            ↩️ Devolver
          </button>
        ` : '';

        div.innerHTML = `
          <div>
            <span class="status-badge-tag ${statusClass}">${statusLabel}</span>
            <div style="font-size:0.92rem; font-weight:800; color:#FFFFFF; margin-bottom:4px;">
              ${itemsText || 'Sin ítems'}
            </div>
            <div style="font-size:0.75rem; color:var(--text-dim);">
              Unidad: <strong>${o.unitInfo || o.unit || '---'}</strong> • Box: <strong>${o.box || currentBox}</strong> • ${o.date || ''} ${o.time || ''}
            </div>
          </div>
          ${returnBtnHtml}
        `;

        container.appendChild(div);
      });
    }

    // ===========================================
    // SISTEMA DE DEVOLUCIONES (MECÁNICOS)
    // ===========================================
    function tryReturn(reqId) {
      const order = allLoadedOrders.find(o => o.reqId === reqId);
      if (!order) return;

      const returnableItems = (order.items || []).filter(i => i.status === "ENTREGADO" || !i.status || order.status === "ENTREGADO");

      if (returnableItems.length === 0) {
        showModal("Atención", "Ya no hay repuestos para devolver en este pedido.", "⚠️");
        return;
      }

      const optionsHtml = returnableItems.map(i => {
        const safeName = (i.name || '').replace(/"/g, '&quot;');
        return `<option value="${safeName}" data-qty="${i.qty}">${i.name} (Max: ${i.qty})</option>`;
      }).join('');

      const htmlContent = `
        <div style="text-align:left; font-size:0.85rem; color:var(--text-muted); margin-bottom:6px; font-weight:800;">
          1. ¿Qué repuesto deseas devolver?
        </div>
        <select id="returnItemSelect" style="width:100%; padding:10px; margin-bottom:15px; border-radius:6px; background:#0B0E14; color:#FFF; border:1px solid var(--border); font-size:0.9rem; outline:none;" onchange="updateReturnQtyMax(this)">
          ${optionsHtml}
        </select>

        <div style="text-align:left; font-size:0.85rem; color:var(--text-muted); margin-bottom:6px; font-weight:800;">
          2. ¿Cuántas unidades devuelves?
        </div>
        <div style="display:flex; align-items:center; gap:10px; margin-bottom:15px;">
           <input type="number" id="returnQtyInput" min="1" max="${returnableItems[0].qty}" value="${returnableItems[0].qty}" style="width:90px; padding:10px; border-radius:6px; background:#0B0E14; color:#FFF; border:1px solid var(--border); font-size:1rem; outline:none; text-align:center; font-weight:700;">
           <span style="font-size:0.8rem; color:var(--text-dim); font-weight:600;" id="returnQtyMaxLabel">de ${returnableItems[0].qty} disponibles</span>
        </div>
        
        <div style="text-align:left; font-size:0.85rem; color:var(--text-muted); margin-bottom:6px; font-weight:800;">
          3. Motivo (Opcional):
        </div>
        <input type="text" id="returnReasonInput" placeholder="Ej. Pieza equivocada, Defecto..." style="width:100%; padding:10px; border-radius:6px; background:#0B0E14; color:#FFF; border:1px solid var(--border); font-size:0.9rem; outline:none;">
      `;

      showModal("Devolución de Repuesto", htmlContent, "↩️", true, () => {
        const itemEl = document.getElementById('returnItemSelect');
        const qtyEl = document.getElementById('returnQtyInput');
        const inputEl = document.getElementById('returnReasonInput');
        
        const itemName = itemEl ? itemEl.value : "";
        const returnQty = qtyEl ? parseInt(qtyEl.value, 10) : 1;
        let reason = inputEl ? inputEl.value.trim() : "Sin motivo especificado";

        if (!itemName || isNaN(returnQty) || returnQty < 1) {
          showModal("Error", "Cantidad inválida.", "⚠️");
          return;
        }

        google.script.run.withSuccessHandler(res => {
          if (res && res.success) {
            showModal("Devolución Solicitada", "La solicitud de devolución fue enviada al Pañol.", "✅");
            refreshOrders();
          } else {
            showModal("Error", (res && res.error) || "No se pudo registrar la devolución.", "⛔");
            refreshOrders(); 
          }
        }).requestRefund(reqId, itemName, reason, returnQty);
      });
    }

    window.updateReturnQtyMax = function(selectEl) {
      if (!selectEl) return;
      const selectedOption = selectEl.options[selectEl.selectedIndex];
      if (!selectedOption) return;
      const maxQty = selectedOption.getAttribute('data-qty');
      const qtyInput = document.getElementById('returnQtyInput');
      const qtyLabel = document.getElementById('returnQtyMaxLabel');

      if (qtyInput && qtyLabel) {
        qtyInput.max = maxQty;
        qtyInput.value = maxQty;
        qtyLabel.innerText = `de ${maxQty} disponibles`;
      }
    };

    function startAutoUpdate() {
      setInterval(refreshOrders, 15000);
      refreshOrders();
    }

    // ===========================================
    // WEBSOCKETS EN TIEMPO REAL
    // ===========================================
    function initWebSockets() {
      if (typeof io === 'undefined') return;
      const socket = io();

      socket.on('taller_hold_updated', data => {
        if (data && data.opId === activeOpId) {
          holdUnits = data.units || [];
          if (holdUnits.length === 0) {
            selectedHoldUnitIndex = -1;
          } else if (selectedHoldUnitIndex < 0 || selectedHoldUnitIndex >= holdUnits.length) {
            selectedHoldUnitIndex = 0;
          }
          renderHoldUnits();
          loadSelectedUnitDetails();
        }
      });

      socket.on('task_status_changed', data => {
        if (holdUnits.length > 0 && holdUnits[selectedHoldUnitIndex]) {
          fetchUnitTimeline(holdUnits[selectedHoldUnitIndex]);
        }
      });

      socket.on('task_updated', data => {
        if (holdUnits.length > 0 && holdUnits[selectedHoldUnitIndex]) {
          fetchUnitTimeline(holdUnits[selectedHoldUnitIndex]);
        }
      });

      socket.on('orders_sync', orders => {
        allLoadedOrders = orders || [];
        updateActiveOrdersBadge(allLoadedOrders);
        renderLiveOrders(allLoadedOrders);
      });
    }

    // ===========================================
    // MODALES GENERALES
    // ===========================================
    function showModal(title, msg, icon = "ℹ️", isConfirm = false, onConfirm = null) {
      document.getElementById('modalTitle').innerText = `${icon} ${title}`;
      document.getElementById('modalBody').innerHTML = msg;
      
      const btnCancel = document.getElementById('modalBtnCancel');
      const btnConfirm = document.getElementById('modalBtnConfirm');

      btnCancel.style.display = isConfirm ? 'block' : 'none';
      btnConfirm.onclick = () => {
        closeModal();
        if (onConfirm) onConfirm();
      };

      document.getElementById('customModal').classList.add('open');
    }

    function closeModal() {
      document.getElementById('customModal').classList.remove('open');
    }
  </script>
</body>
</html>
